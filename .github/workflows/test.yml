name: Ujian
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ujian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - name: Pasang Chromium untuk ujian runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Uji runtime dalam Chromium
        run: node test/browser-runtime.cjs
